function isAllowed(page){
  const key=String(page||'').trim().toLowerCase();
  if(!key || key==='auth' || !PAGES[key]) return false;
  const user=SESSION&&SESSION.user?SESSION.user:{};
  return !!(window.AITPageAccess&&AITPageAccess.isAllowed?AITPageAccess.isAllowed(user,key):false);
}
async function requireAuth(){
  SESSION=readSession();
  if(!SESSION||!SESSION.token){location.href='auth.html';return false;}
  try{
    const verified=await jsonp({module:'auth',action:'verify',token:SESSION.token});
    if(!verified||verified.ok===false||!verified.user)throw new Error(verified&&verified.message||'Session expired');
    SESSION={token:SESSION.token,user:verified.user,loginAt:SESSION.loginAt||new Date().toISOString()};
    window.AITSession?AITSession.set(SESSION):safeStoreSet('ait_auth_session',JSON.stringify(SESSION));
  }catch(e){
    window.AITSession?AITSession.clear():safeStoreRemove('ait_auth_session');
    location.href='auth.html?reason=expired';
    return false;
  }
  ALLOWED=Object.keys(PAGES).filter(p=>p!=='auth'&&isAllowed(p));
  if(!ALLOWED.length){
    location.href='auth.html?reason=no_access';
    return false;
  }
  document.getElementById('userChip').textContent=(SESSION.user.username||SESSION.user.email||'User')+' · '+(SESSION.user.job||'');
  document.getElementById('permText').textContent=ALLOWED.length+' page'+(ALLOWED.length===1?'':'s')+' enabled';
  return true;
}
function renderNav(){const nav=document.getElementById('nav');const groups={};ALLOWED.forEach(k=>{if(!PAGES[k])return;const g=PAGES[k].group||'Other';groups[g]=groups[g]||[];groups[g].push(k)});nav.innerHTML=Object.keys(groups).map(g=>'<div class="nav-group" data-group="'+g+'"><div class="group-label">'+groupText(g)+'</div>'+groups[g].map(k=>'<a class="nav-link" href="#'+k+'" data-page="'+k+'"><span class="nav-code">'+PAGES[k].code+'</span><span>'+pageText(k,'title')+'</span></a>').join('')+'</div>').join('');}
function getPageFromHash(){const h=(location.hash||'').replace('#','').trim().toLowerCase();if(PAGES[h]&&isAllowed(h))return h;return ALLOWED[0];}
function setShellLoading(show,pageKey){
  clearTimeout(PAGE_LOAD_FALLBACK);
  if(show){
    loader.classList.remove('hidden');loader.setAttribute('aria-busy','true');
    if(shellLoadText){const p=PAGES[pageKey],ar=safeStoreGet('ait_lang')==='ar';shellLoadText.textContent=ar?SHELL_AR.ui.preparing:'Preparing '+(p?p.title:'dashboard page')+'...';}
    PAGE_LOAD_FALLBACK=setTimeout(()=>setShellLoading(false,pageKey),32000);
  }else{loader.classList.add('hidden');loader.setAttribute('aria-busy','false');}
}
function loadPage(pageKey){
  if(!isAllowed(pageKey)){showNoAccess(pageKey);return;}
  CURRENT_PAGE=pageKey;
  noAccess.classList.remove('show');
  const p=PAGES[pageKey];
  document.querySelectorAll('.nav-link').forEach(a=>a.classList.toggle('active',a.dataset.page===pageKey));
  titleEl.textContent=pageText(pageKey,'title');subEl.textContent=pageText(pageKey,'sub');
  const params=new URLSearchParams({token:SESSION.token,api:API_URL,v:String(Date.now())});
  const standaloneUrl=p.file+'?'+params.toString();
  params.set('embedded','1');
  const embeddedUrl=p.file+'?'+params.toString();
  openNew.href=standaloneUrl;
  setShellLoading(true,pageKey);
  updateRefreshState(true);
  frame.setAttribute('aria-busy','true');
  frame.src=embeddedUrl;
  safeStoreSet('ait_shell_page',pageKey);
  toggleMenu(false);
}
function showNoAccess(pageKey){setShellLoading(false,pageKey);noAccess.classList.add('show');titleEl.textContent='No access';subEl.textContent='Page not allowed: '+pageKey;}
frame.addEventListener('load',()=>{enforcePermissions();syncEmbeddedFrame();});
function syncEmbeddedFrame(){
  try{
    if(!frame||!frame.contentWindow)return;
    const theme=document.documentElement.getAttribute('data-theme')||'dark';
    const lang=safeStoreGet('ait_lang')||'en';
    frame.contentWindow.postMessage({cmd:'setEmbedded',value:true},'*');
    frame.contentWindow.postMessage({cmd:'setTheme',value:theme},'*');
    frame.contentWindow.postMessage({cmd:'setLang',value:lang},'*');
  }catch(e){}
}
function resolveHashAndLoad(){
  const resolved=getPageFromHash();
  const raw=(location.hash||'').replace('#','').trim().toLowerCase();
  if(raw!==resolved)history.replaceState(null,'','#'+resolved);
  loadPage(resolved);
}
window.addEventListener('hashchange',resolveHashAndLoad);
function enforcePermissions(){try{const doc=frame.contentDocument||frame.contentWindow.document;if(!doc||!SESSION||!SESSION.user)return;if(getPageFromHash()==='goldmap')return;const u=SESSION.user;const disableFilters=!!u.view_only||!u.can_filter;const disableExport=!!u.view_only||!u.can_export;if(disableFilters){doc.querySelectorAll('select,input[type="date"],input[type="search"],.filterbar input,.filterbar select').forEach(el=>{el.disabled=true;el.title='Filters disabled by permission';});doc.querySelectorAll('button').forEach(btn=>{const t=(btn.textContent||'').toLowerCase();if(t.includes('clear')||t.includes('filter')||t.includes('refresh')){btn.disabled=true;btn.style.opacity=.45;btn.title='Disabled by permission';}});}if(disableExport){doc.querySelectorAll('button,a').forEach(el=>{const t=(el.textContent||'').toLowerCase();if(t.includes('export')||t.includes('excel')||t.includes('download')){el.style.display='none';}});}if(u.view_only){doc.querySelectorAll('input,textarea,button').forEach(el=>{const t=(el.textContent||'').toLowerCase();if(!t.includes('en')&&!t.includes('عربي')&&!t.includes('中文'))el.disabled=true;});}}catch(e){console.warn('Permission enforcement skipped:',e)}}
function formatUpdateTime(value){
  if(!value)return safeStoreGet('ait_lang')==='ar'?SHELL_AR.ui.never:'Not updated yet';
  try{return new Date(value).toLocaleString(safeStoreGet('ait_lang')==='ar'?'ar-EG':'en-GB',{dateStyle:'short',timeStyle:'medium'});}catch(e){return value}
}
function updateRefreshState(updating,stamp){
  const box=document.getElementById('refreshState'),label=document.getElementById('refreshStateLabel'),time=document.getElementById('refreshStateTime');
  if(!box||!label||!time)return;const ar=safeStoreGet('ait_lang')==='ar';box.classList.toggle('updating',!!updating);
  if(updating){label.textContent=ar?SHELL_AR.ui.updating:'Updating...';time.textContent=ar?'يرجى الانتظار':'Please wait';}
  else{const saved=stamp||safeStoreGet('ait_last_update_'+CURRENT_PAGE)||'';label.textContent=ar?SHELL_AR.ui.updated:'Last update';time.textContent=formatUpdateTime(saved);}
}
function reloadPage(){updateRefreshState(true);loadPage(getPageFromHash())}
async function logout(){try{const cb='ait_logout_'+Date.now();const s=document.createElement('script');window[cb]=()=>{delete window[cb];if(s.parentNode)s.parentNode.removeChild(s)};s.src=API_URL+'?module=auth&action=logout&token='+encodeURIComponent(SESSION&&SESSION.token||'')+'&callback='+cb+'&t='+Date.now();document.body.appendChild(s)}catch(e){}window.AITSession?AITSession.clear():safeStoreRemove('ait_auth_session');location.href='auth.html'}
function applyShellTheme(value,notify=true){
  const next=value==='light'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  safeStoreSet('ait_shell_theme',next);
  safeStoreSet('ait_theme',next);
  document.getElementById('themeBtn').textContent=next==='dark'?'Dark':'Light';
  if(notify){try{if(frame&&frame.contentWindow)frame.contentWindow.postMessage({cmd:'setTheme',value:next},'*');}catch(e){}}
}
function toggleTheme(){applyShellTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')}
function applyShellLanguage(value,notify=true){
  const next=String(value||'en').toLowerCase().startsWith('ar')?'ar':'en';
  safeStoreSet('ait_lang',next);
  document.documentElement.lang=next;document.documentElement.dir=next==='ar'?'rtl':'ltr';
  const b=document.getElementById('langBtn');if(b)b.textContent=next==='ar'?'EN':'عربي';
  const search=document.getElementById('navSearch');if(search)search.placeholder=next==='ar'?SHELL_AR.ui.search:'Search pages...';
  const logoutBtn=document.querySelector('.tb-btn.primary');if(logoutBtn)logoutBtn.textContent=next==='ar'?SHELL_AR.ui.logout:'Logout';
  const openBtn=document.getElementById('openNew');if(openBtn)openBtn.textContent=next==='ar'?SHELL_AR.ui.open:'Open';
  const refreshBtn=[...document.querySelectorAll('.tb-btn')].find(x=>/Refresh Page|تحديث الصفحة/.test(x.textContent));if(refreshBtn)refreshBtn.textContent=next==='ar'?SHELL_AR.ui.refresh:'Refresh Page';
  const themeBtn=document.getElementById('themeBtn');if(themeBtn)themeBtn.textContent=next==='ar'?(document.documentElement.getAttribute('data-theme')==='dark'?SHELL_AR.ui.dark:SHELL_AR.ui.light):(document.documentElement.getAttribute('data-theme')==='dark'?'Dark':'Light');
  const brandTitle=document.querySelector('.brand-title'),brandSub=document.querySelector('.brand-sub');if(brandTitle)brandTitle.textContent=next==='ar'?SHELL_AR.ui.brand:'Pit2Port Dashboard';if(brandSub)brandSub.textContent=next==='ar'?SHELL_AR.ui.brandSub:'Unified operations control center';
  const perm=document.getElementById('permText');if(perm&&SESSION)perm.textContent=next==='ar'?(ALLOWED.length+' صفحة متاحة'):(ALLOWED.length+' page'+(ALLOWED.length===1?'':'s')+' enabled');updateRefreshState(false);
  renderNav();if(CURRENT_PAGE&&PAGES[CURRENT_PAGE]){titleEl.textContent=pageText(CURRENT_PAGE,'title');subEl.textContent=pageText(CURRENT_PAGE,'sub');}
  if(notify){try{if(frame&&frame.contentWindow)frame.contentWindow.postMessage({cmd:'setLang',value:next},'*');}catch(e){}}
}
function toggleLanguage(){applyShellLanguage((safeStoreGet('ait_lang')||'en')==='ar'?'en':'ar')}
window.addEventListener('message',event=>{
  const d=event&&event.data||{};
  if(d.cmd==='childThemeChanged'&&d.value)applyShellTheme(d.value,false);
  if(d.cmd==='childLangChanged'&&d.value)applyShellLanguage(d.value,false);
  if(event.source===frame.contentWindow&&d.cmd==='aitPageReady'&&(!d.pageKey||d.pageKey===CURRENT_PAGE)){
    frame.setAttribute('aria-busy','false');setShellLoading(false,CURRENT_PAGE);const stamp=new Date().toISOString();safeStoreSet('ait_last_update_'+CURRENT_PAGE,stamp);updateRefreshState(false,stamp);enforcePermissions();
  }
});
function toggleMenu(show){document.getElementById('sidebar').classList.toggle('open',!!show);document.getElementById('overlay').classList.toggle('show',!!show);const b=document.querySelector('.menu-btn');if(b)b.setAttribute('aria-expanded',String(!!show))}
document.addEventListener('keydown',e=>{if(e.key==='Escape')toggleMenu(false)});
function filterNav(q){q=String(q||'').toLowerCase().trim();document.querySelectorAll('.nav-group').forEach(group=>{let visible=0;group.querySelectorAll('.nav-link').forEach(a=>{const show=!q||a.textContent.toLowerCase().includes(q);a.style.display=show?'':'none';if(show)visible++;});group.style.display=visible?'':'none';});}
function tick(){document.getElementById('clock').textContent=new Date().toLocaleString('en-GB')}setInterval(tick,1000);tick();
(async function init(){if(!await requireAuth())return;renderNav();const theme=safeStoreGet('ait_shell_theme')||'dark';applyShellTheme(theme,false);applyShellLanguage(safeStoreGet('ait_lang')||'en',false);updateRefreshState(false);if(!location.hash){const last=safeStoreGet('ait_shell_page');location.hash='#'+(last&&PAGES[last]&&isAllowed(last)?last:getPageFromHash());}else resolveHashAndLoad();})();
</script>
</body>
